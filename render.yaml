services:
  - type: web
    name: offercheck
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-4o-mini
